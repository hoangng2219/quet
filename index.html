<!-- D67 — TRANG QUÉT TEM cho BQL (GitHub Pages: camera trực tiếp dùng được — trong Apps Script bị chặn).
     Link riêng từng BQL: …/quet/#k=<khoá>&api=<URL web app /exec>[&dot=…&phong=…]. Khoá nằm sau # → không gửi lên GitHub.
     Gọi web app bằng fetch POST text/plain (xem ApiQuetService.gs). Mất mạng: lượt quét lưu trong máy, có mạng tự gửi (giờ ghi = giờ quét).
     Thiết kế: docs/plans/D67-trang-quet-github-tich-tay-tai-anh-tem.md. Trang KHÔNG chứa khoá / dữ liệu nào — mã nguồn công khai. -->

<!-- KTXSoDo: chép từ src/frontend/SoDoPhong.html bằng tools/chep-so-do-trang-quet.cjs — KHÔNG sửa tay -->
<script>
  window.KTXSoDo = (function () {
    var ICON = '<svg class="ico-so-do" viewBox="0 0 20 16" width="18" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1 5V1h18v4M1 11v4h18v-4"/><rect x="4" y="3.4" width="5" height="3" rx=".6"/><rect x="11" y="3.4" width="5" height="3" rx=".6"/><rect x="4" y="9.6" width="5" height="3" rx=".6"/><rect x="11" y="9.6" width="5" height="3" rx=".6"/></svg>';
    function thoat(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function kho(xoay) { return xoay === 'doc' ? { w: 1, h: 2 } : { w: 2, h: 1 }; }
    function tenBo(k) { var p = String(k).split(':'); return p[0] === 'Tang' ? 'Bộ ' + p[1] : 'Bộ đơn C' + p[1]; }
    function soNgan(k) { var p = String(k).split(':'); return p[0] === 'Tang' ? p[1] : 'C' + p[1]; }
    /** Vị trí chuẩn theo chiều kim đồng hồ (giống _oChuanSoDo_). */
    function oChuan(cot, hang) {
      var s = [], n = Math.floor((cot - 2) / 2), x;
      for (x = 0; x < n; x++) s.push({ x: 1 + x * 2, y: 0, xoay: 'ngang' });
      s.push({ x: cot - 1, y: 1, xoay: 'doc' });
      for (x = n - 1; x >= 0; x--) s.push({ x: 1 + x * 2, y: hang - 1, xoay: 'ngang' });
      s.push({ x: 0, y: 1, xoay: 'doc' });
      return s;
    }
    /** dsBo: [{ k, keThem }] đã xếp tầng rồi đơn theo số → { 'Tang:1': vt } (bộ kê thêm / thừa không có vị trí). */
    function xepChuan(dsBo, cot, hang) {
      var o = oChuan(cot, hang), vt = {}, j = 0;
      dsBo.forEach(function (b) { if (!b.keThem && j < o.length) vt[b.k] = o[j++]; });
      return vt;
    }
    /** '' nếu đặt được bộ k ở vt trong sd = { cot, hang, vt }; không thì câu báo lỗi. */
    function kiemTra(sd, k, vt) {
      var q = kho(vt.xoay);
      if (vt.x < 0 || vt.y < 0 || vt.x + q.w > sd.cot || vt.y + q.h > sd.hang) return 'Ra ngoài phòng';
      var de = Object.keys(sd.vt).filter(function (k2) {
        if (k2 === k) return false;
        var v = sd.vt[k2], r = kho(v.xoay);
        return vt.x < v.x + r.w && v.x < vt.x + q.w && vt.y < v.y + r.h && v.y < vt.y + q.h;
      })[0];
      return de ? 'Đè lên ' + tenBo(de) : '';
    }
    function viTri(sd, vt) {
      var q = kho(vt.xoay), p = function (a, b) { return (a / b * 100).toFixed(4) + '%'; };
      return 'left:' + p(vt.x, sd.cot) + ';top:' + p(vt.y, sd.hang) + ';width:' + p(q.w, sd.cot) + ';height:' + p(q.h, sd.hang);
    }
    /**
     * khung(sd, noiDung, opts) — HTML khung phòng (tường, 2 cửa ở cạnh ngắn, lưới) bọc noiDung (các .sdp-bo đã định vị).

  // ================================================================== D77: ĐẾM SĨ SỐ = BẢN KIỂM ĐẾM (sửa trong máy, nộp cho BQL duyệt — app không đổi tới lúc duyệt)

  function coChoDay(maDay) { return S.hangCho.some(function (l) { return l.maDay === maDay && l.loai === 'nopBanKiemDem'; }); }
  function docNhap(mp) { try { return JSON.parse(doc(TIEN_TO + 'nhap_' + mp) || 'null'); } catch (e) { return null; } }

      so: JSON.parse(JSON.stringify(p.soDo || { cot: 10, hang: 6, vt: {} })), g: {}, cho: (p.cho || []).map(nguoiTuApp), nop: null, doi: false };
    (p.bo || []).forEach(function (b) { b.giuong.forEach(function (g) { if (g.cn || g.hong || g.giu) n.g[g.ma] = { cn: nguoiTuApp(g.cn), hong: !!g.hong, giu: !!g.giu && !g.cn }; }); });
    return n;
  }
  function phongDem() { var x = docDem(S.maDay); return x ? x.phong.filter(function (p) { return p.MaPhong === S.maPhongDem; })[0] : null; }

      var ly = ((document.querySelector('.lyDoNu') || {}).value || '').trim();
      var pp = phongDem();
      if (pp && pp.PhongNu && gt === 'Nam' && !ly) { loiL.textContent = 'Phòng nữ — ghi lý do xếp Nam vào.'; loiL.hidden = false; return; }
      luu(TIEN_TO + 'gtNho', gt);
      var ten = ((document.querySelector('.tenTam') || {}).value || '').trim(), nh = S.nhap;
      suaNhap(function (n) {
        var moi = { moi: true, ma: 'moi-' + maId(), ten: ten || '(chưa biết tên)', gt: gt, lyDoNu: ly };
        if (!nh.giuong) { n.cho.push(moi); return; }
        if (nh.thay) veHangCho2(n, nh.giuong);
        n.g[nh.giuong] = { cn: moi, hong: false, xn: false };
      });
      xongThaoTac();
    }
    else if (viec === 'boNhap') {
      if (b.getAttribute('data-hoi') !== '1') { b.setAttribute('data-hoi', '1'); b.textContent = 'Bấm lần nữa để bỏ bản nháp'; return; }
      luuNhap(S.maPhongDem, null); toast('Đã lấy lại bản app'); vePhongDem();
    }
    else if (viec === 'nopBan') nopBan(b);
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.classList.contains('ttCa')) { document.querySelectorAll('.ttCb').forEach(function (x) { x.checked = ev.target.checked; }); demTay(); }
    else if (ev.target.classList.contains('ttCb')) demTay();
  });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-viec]'); if (!b) return;
    var viec = b.getAttribute('data-viec');
    if (viec === 'dongLop') { if (ev.target === b || b.tagName === 'BUTTON') dongLop(); return; }
    if (b.disabled) return;
    if (viec === 'vaoDot') { S.maDot = b.getAttribute('data-dot'); S.dot = null; S.dsPhong = []; diToi('dot'); }
    else if (viec === 'taiTruoc') taiTruoc(b.getAttribute('data-dot'), b);
    else if (viec === 'chonDay') { S.dayChon = b.getAttribute('data-day'); veDot(); }
    else if (viec === 'vaoPhong') { S.maPhong = b.getAttribute('data-phong'); diToi('phong'); }
    else if (viec === 'batCam') batCamera();
    else if (viec === 'veDsDot') { S.maDot = ''; S.maPhong = ''; try { history.replaceState({ man: 'ds' }, ''); } catch (e) { /* bỏ qua */ } hienMan('ds'); }
    else if (viec === 'guiNgay') { b.disabled = true; b.innerHTML = '<i class="xoay"></i> Đang gửi…'; guiHangCho(); }
    else if (viec === 'sua') { if (!S.dangGuiMa[b.getAttribute('data-ma')]) moSua(b.getAttribute('data-ma')); }
    else if (viec === 'tichTay') moTichTay();
    else if (viec === 'xongPhong') moXong();
    else if (viec === 'chonTT') {
      b.parentNode.querySelectorAll('.chon').forEach(function (x) { x.classList.toggle('on', x === b); });
      var v = document.querySelector('.suaLyDoVung'); if (v) v.hidden = b.getAttribute('data-tt') !== 'VangPhep';
    } else if (viec === 'xongTT') { b.parentNode.querySelectorAll('.xongTT').forEach(function (x) { var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on)); }); }
    else if (viec === 'luuSua') {
      var on = document.querySelector('.tam .chon.on'), loiS = document.querySelector('.tam-loi');
      if (!on) { loiS.textContent = 'Chọn kết quả.'; loiS.hidden = false; return; }
      var t = on.getAttribute('data-tt'), ly = (document.querySelector('.suaLyDo') || {}).value || '';
      if (t === 'VangPhep' && !ly) { loiS.textContent = 'Chọn lý do vắng.'; loiS.hidden = false; return; }
      var maS = b.getAttribute('data-ma');
      guiTuLop(b, { loai: 'sua', ma: maS, tt: t, truoc: b.getAttribute('data-truoc'), maLyDo: ly, ghiChu: (document.querySelector('.suaGhiChu') || {}).value || '' }, [maS], function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm — gửi khi có mạng'); return; }
        if (x.ket === 'daGhi') capNhatCucBo(maS, t, 'tay', new Date().toISOString());
        baoKq(x.ket === 'daGhi' ? { ok: true, ket: 'daGhi', soGhi: 1 } : x);
      });
    } else if (viec === 'hoanTac') {
      var maH = b.getAttribute('data-ma');
      var xongH = function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm — gửi khi có mạng'); return; }
        if (x.ok) { capNhatCucBo(maH, '', '', ''); $('vungKq').innerHTML = '<div class="bao canh">↶ Đã hoàn tác</div>'; } else baoKq(x);
        veDs();
      };
      if (b.closest('.tam')) guiTuLop(b, { loai: 'sua', ma: maH, tt: '', truoc: 'CoMat' }, [maH], xongH);
      else { b.disabled = true; b.innerHTML = '<i class="xoay"></i> Đang hoàn tác…'; S.dangGuiMa[maH] = true; veDs(); ghiLuot({ loai: 'sua', ma: maH, tt: '', truoc: 'CoMat' }, function (x) { delete S.dangGuiMa[maH]; xongH(x); }); }
    } else if (viec === 'ghiTay') {
      var tt = b.getAttribute('data-tt'), ds = [].map.call(document.querySelectorAll('.ttCb:checked'), function (x) { return x.value; });
      var lyT = (document.querySelector('.ttLyDo') || {}).value || '';
      if (tt === 'VangPhep' && !lyT) { var lT = document.querySelector('.tam-loi'); lT.textContent = 'Chọn lý do vắng (ô ngay trên).'; lT.hidden = false; return; }
      guiTuLop(b, { loai: 'tay', dsMa: ds, tt: tt, maLyDo: lyT }, ds, function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm ' + ds.length + ' người — gửi khi có mạng'); return; }
        ds.forEach(function (m) { if (!(x.boQua || []).some(function (q) { return q === m; })) capNhatCucBo(m, tt, 'tay', new Date().toISOString()); });
        baoKq(x);
      });
    } else if (viec === 'xacNhanXong') {
      var dsX = {};
      document.querySelectorAll('.tam .xong-dong[data-ma]').forEach(function (r) { var c = r.querySelector('.xongTT.on'); dsX[r.getAttribute('data-ma')] = { tt: c ? c.getAttribute('data-tt') : 'KhongThay' }; });
      guiTuLop(b, { loai: 'xong', ds: dsX }, Object.keys(dsX), function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm "Xong phòng" — gửi khi có mạng'); history.back(); return; }
        bip('ok'); toast('✓ Xong phòng'); history.back();
      });
    }
  });

  // D67.1: ~5 giây / lần hỏi "dữ liệu có đổi không" (chỉ 1 mã phiên bản — rất nhẹ). Đổi (BQL kết thúc / huỷ / mở đợt, BQL khác ghi) → tải lại màn đang mở.
  // Đang mở tấm trượt thì để dành, đóng tấm mới tải. Quay lại tab / mở lại app → hỏi ngay.
  var cdBiet = '', dmBiet = '', canTaiLai = false, dangHoi = false; // D77: dmBiet — giường / người / chỗ giữ (app đếm sĩ số, xếp giường…)
  function taiLaiManHienTai() {
    if (S.man === 'ds') taiDs(); else if (S.man === 'dot') taiDot(); else if (S.man === 'phong') taiPhong();
    else if ((S.man === 'demDay' || S.man === 'demPhong') && coMang && !coChoDay(S.maDay)) taiDem(S.maDay, true).then(veLai, function () {}); // D76: còn lượt chờ gửi thì giữ bản trong máy
  }
  // D67.3: vẫn hỏi khi đang "Mất mạng" — 1 lượt lỗi thoáng qua (khoá màn hình giữa lượt gửi, sóng chập chờn) trước đây làm dừng hẳn việc đồng bộ
  // vì chỉ sự kiện 'online' mới bật lại, mà máy không mất mạng thật thì không bao giờ phát sự kiện đó. Hỏi được lại → coi như vừa có mạng → tải lại màn.
  function kiemTraNgay(epTaiLai) {
    if (dangHoi || document.hidden || S.man === 'khoa' || !K || !API) return;
    dangHoi = true;
    var vuaMatMang = !coMang;
    goiTho({ viec: 'phienBan' }).then(function (r) {
      dangHoi = false;
      var laDem = S.man === 'demDay' || S.man === 'demPhong';
      var doi = (cdBiet && r.cd !== cdBiet) || (laDem && dmBiet && r.dm && r.dm !== dmBiet) || epTaiLai || vuaMatMang; cdBiet = r.cd; if (r.dm) dmBiet = r.dm;
      if (!doi) return;
      if ($('lop').innerHTML) { canTaiLai = true; return; }
      taiLaiManHienTai();
    }, function () { dangHoi = false; });
  }
  setInterval(function () { kiemTraNgay(false); if (coMang && S.hangCho.length) guiHangCho(); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) kiemTraNgay(true); });
  function laDotMat(err) { return err && /Không tìm thấy đợt/i.test(err.message || ''); }
  /** Đợt đang xem đã kết thúc / bị huỷ / phòng bị bỏ ra → tắt camera, báo rõ, về danh sách đợt. Lượt chờ gửi của đợt này giữ nguyên (gửi lên sẽ báo lỗi từng lượt). */
  function hetDot(chu) {
    tatCamera(); lopDangGui = false; $('lop').innerHTML = '';
    luu(TIEN_TO + 'tt_' + S.maDot, null);
    S.man = 'hetDot'; S.dot = null; S.dsPhong = []; S.phong = null;
    $('dayDuoi').hidden = true; $('nutLui').hidden = true; $('tieuDe').textContent = 'Quét tem KTX';
    bip('canh');
    $('than').innerHTML = '<div class="khoa"><div class="icon">🏁</div><h2>' + thoat(chu) + '</h2><p class="phu">Không quét / ghi thêm được cho đợt này. Chọn đợt khác đang chạy.</p>' +
      '<button class="nut xanh" style="max-width:320px;margin:12px auto 0" data-viec="veDsDot">Về danh sách đợt</button></div>';
  }

  // ------------------------------------------------------------------ khởi động
  if (/Zalo|FBAN|FBAV|Instagram/i.test(navigator.userAgent || '')) toast('Đang mở trong Zalo / Facebook — nếu camera không chạy, mở bằng Safari / Chrome.');
  if (!K || !API) {
    $('than').innerHTML = '<div class="khoa"><div class="icon">🔗</div><h2>Thiếu link quét</h2><p class="phu">Mở trang này bằng link riêng được cấp trong app (Quản lý tài khoản → Link quét tem → Mở trang quét / quét mã QR).</p></div>';
    return;
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { /* trình duyệt không hỗ trợ — vẫn dùng được khi có mạng */ }); // D76
  capNhatMang();
  try { history.replaceState({ man: 'ds' }, ''); } catch (e) { /* bỏ qua */ }
  if (thamSo.dot) { S.maDot = thamSo.dot; hienMan('ds'); diToi('dot'); } else hienMan('ds');
  if (coMang) guiHangCho();
  kiemTraNgay(false);
})();
</script>
</body>
</html>
