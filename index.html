<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<title>Quét tem KTX</title>
<!-- D67 — TRANG QUÉT TEM cho BQL (GitHub Pages: camera trực tiếp dùng được — trong Apps Script bị chặn).
     Link riêng từng BQL: …/quet/#k=<khoá>&api=<URL web app /exec>[&dot=…&phong=…]. Khoá nằm sau # → không gửi lên GitHub.
     Gọi web app bằng fetch POST text/plain (xem ApiQuetService.gs). Mất mạng: lượt quét lưu trong máy, có mạng tự gửi (giờ ghi = giờ quét).
     Thiết kế: docs/plans/D67-trang-quet-github-tich-tay-tai-anh-tem.md. Trang KHÔNG chứa khoá / dữ liệu nào — mã nguồn công khai. -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --xanh:#2563eb; --ok:#0ca30c; --do:#d03b3b; --vang:#b45309; --vien:#e5e7eb; --phu:#6b7280; --nam:#16a34a; --nu:#ec4899; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#f3f4f6; color:#111827; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; cursor:pointer; }
  .dau { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--vien); display:flex; align-items:center; gap:8px; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); }
  .dau b { flex:1; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lui { border:0; background:none; font-size:26px; line-height:1; padding:0 6px; min-width:36px; min-height:36px; }
  .mang { font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; background:#dcfce7; color:#166534; white-space:nowrap; }
  .mang.mat { background:#fee2e2; color:#b91c1c; }
  .than { max-width:560px; margin:0 auto; padding:12px; padding-bottom:110px; }
  .phu { color:var(--phu); font-size:12.5px; }
  .the { background:#fff; border:1px solid var(--vien); border-radius:12px; padding:12px; margin:0 0 10px; }
  .h { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .nhan { font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .n-chay { background:#dbeafe; color:#1d4ed8; } .n-qua { background:#fee2e2; color:#b91c1c; } .n-ok { background:#dcfce7; color:#166534; }
  .tien { height:6px; background:var(--vien); border-radius:9px; overflow:hidden; margin:8px 0 4px; } .tien i { display:block; height:100%; background:var(--ok); }
  .nut { display:flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:10px; padding:10px 12px; min-height:46px; font-weight:700; background:#e5e7eb; color:#111827; text-decoration:none; width:100%; }
  .nut.xanh { background:var(--xanh); color:#fff; } .nut.vien { background:#fff; border:1px solid #d1d5db; } .nut.do { background:#fee2e2; color:#b91c1c; }
  .nut:disabled { opacity:.45; cursor:default; }
  .hang-nut { display:flex; gap:8px; margin-top:10px; }
  .luoi { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
  .op { border:1px solid var(--vien); background:#fff; border-radius:10px; padding:10px 4px; text-align:center; font-weight:800; min-height:56px; }
  .op small { display:block; font-weight:500; font-size:11px; color:var(--phu); }
  .op.xong { background:#dcfce7; border-color:#86efac; color:#166534; } .op.dang { background:#dbeafe; border-color:#93c5fd; color:#1d4ed8; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; }
  .chip { flex:none; border:1px solid #d1d5db; background:#fff; border-radius:999px; padding:7px 12px; font-weight:700; font-size:13px; }
  .chip.on { background:#111827; color:#fff; border-color:#111827; }
  #vungCam { position:relative; background:#0f172a; border-radius:12px; overflow:hidden; min-height:220px; margin-bottom:10px; }
  #cam { width:100%; }
  #cam video { width:100% !important; display:block; }
  .cam-chu { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#e2e8f0; text-align:center; padding:16px; font-size:13px; }
  .cam-chu .nut { width:auto; }
  .bao { border-radius:10px; padding:9px 11px; font-weight:700; font-size:14px; border:2px solid; margin-bottom:8px; }
  .bao small { display:block; font-weight:500; font-size:12px; color:#374151; }
  .bao.ok { background:#f0fdf4; border-color:#86efac; color:#166534; } .bao.canh { background:#fffbeb; border-color:#fcd34d; color:#92400e; } .bao.loi { background:#fef2f2; border-color:#fca5a5; color:#b91c1c; }
  .bao .hoan { border:0; background:none; color:var(--xanh); font-weight:700; text-decoration:underline; padding:4px 0 0; }
  .hang-cho { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:10px; padding:8px 11px; font-size:13px; font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .hang-cho button { border:0; background:#3730a3; color:#fff; border-radius:8px; padding:6px 10px; font-weight:700; font-size:12px; }
  .ng { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 2px; border-bottom:1px solid #f1f5f9; width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left; min-height:52px; color:inherit; }
  .ng b { font-size:14px; } .ng .phu { display:block; }
  .tt { font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 8px; white-space:nowrap; }
  .tt-co { background:#dcfce7; color:#166534; } .tt-chua { background:#f3f4f6; color:#374151; } .tt-khong { background:#fee2e2; color:#b91c1c; } .tt-phep { background:#fef3c7; color:#92400e; } .tt-cho { background:#e0e7ff; color:#3730a3; }
  .cham { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; } .cham.nam { background:var(--nam); } .cham.nu { background:var(--nu); }
  .day-duoi { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--vien); padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  .day-duoi .trong { max-width:560px; margin:0 auto; display:flex; gap:8px; }
  .lop { position:fixed; inset:0; z-index:20; background:rgba(15,23,42,.5); display:flex; align-items:flex-end; justify-content:center; }
  .tam { background:#fff; width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:14px; padding-bottom:max(14px, env(safe-area-inset-bottom)); }
  .tam h3 { margin:0 0 6px; font-size:16px; }
  .chon { display:flex; align-items:center; gap:10px; border:1px solid #d1d5db; border-radius:10px; padding:11px; margin-bottom:8px; font-weight:700; background:#fff; width:100%; text-align:left; min-height:46px; }
  .chon.on { border-color:var(--xanh); background:#eff6ff; color:#1d4ed8; }
  .cb { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #f1f5f9; min-height:46px; }
  .cb input { width:22px; height:22px; margin:0; flex:none; }
  select, input[type=text] { width:100%; font:inherit; font-size:15px; padding:10px; border:1px solid #d1d5db; border-radius:10px; background:#fff; margin:6px 0; }
  .khoa { text-align:center; padding:60px 20px; } .khoa .icon { font-size:44px; }
  .cb-ca { background:#f8fafc; border-radius:8px; }
  #toast { position:fixed; left:12px; right:12px; bottom:84px; z-index:30; display:flex; justify-content:center; pointer-events:none; }
  #toast div { background:#111827; color:#fff; border-radius:10px; padding:10px 14px; font-size:14px; max-width:520px; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .rong { text-align:center; color:var(--phu); padding:24px 8px; }
</style>
</head>
<body>
<div class="dau"><button class="lui" id="nutLui" aria-label="Quay lại" hidden>‹</button><b id="tieuDe">Quét tem KTX</b><span class="mang" id="mang">● Có mạng</span></div>
<div class="than" id="than"></div>
<div class="day-duoi" id="dayDuoi" hidden><div class="trong" id="dayDuoiTrong"></div></div>
<div id="lop"></div>
<div id="toast" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  // ------------------------------------------------------------------ cấu hình từ link
  var thamSo = {};
  String(location.hash || '').replace(/^#/, '').split('&').forEach(function (p) { var i = p.indexOf('='); if (i > 0) thamSo[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  function doc(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function luu(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* hết chỗ / chế độ riêng tư */ } }
  var K = /^[0-9a-f]{32}$/.test(thamSo.k || '') ? thamSo.k : (doc('ktxK') || '');
  var API = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(thamSo.api || '') ? thamSo.api : (doc('ktxApi') || '');
  if (thamSo.k && K === thamSo.k) luu('ktxK', K);
  if (thamSo.api && API === thamSo.api) luu('ktxApi', API);
  var TIEN_TO = 'ktx_' + K.slice(0, 8) + '_';
  var S = { ten: '', dots: [], maDot: thamSo.dot || '', dot: null, dsPhong: [], maPhong: '', phong: null, man: '', hangCho: [], dangGui: false, ketQuaGui: null };
  try { S.hangCho = JSON.parse(doc(TIEN_TO + 'hangCho') || '[]'); } catch (e) { S.hangCho = []; }
  var phongMoDau = thamSo.phong || '';
  var $ = function (id) { return document.getElementById(id); };
  var thoat = function (s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var TEN_TT = { CoMat: 'Có mặt', KhongThay: 'Không có ở giường', VangPhep: 'Vắng có phép' };
  var LOP_TT = { CoMat: 'tt-co', KhongThay: 'tt-khong', VangPhep: 'tt-phep' };
  var ICON = { tem: '📷', anh: '🖼', tay: '✍' };
  function gio(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? '' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function ngayNgan(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); if (!m) return ''; var t = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay(); return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][t] + ' ' + m[3] + '/' + m[2]; }
  function maId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function toast(chu) { var t = $('toast'); t.innerHTML = '<div>' + thoat(chu) + '</div>'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.innerHTML = ''; }, 2600); }

  // ------------------------------------------------------------------ âm thanh + rung (giống app D66.2)
  var am = null;
  function moKhoaAmThanh() { try { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; if (!am) am = new AC(); if (am.state === 'suspended') am.resume(); } catch (e) { /* bỏ qua */ } }
  document.addEventListener('touchstart', moKhoaAmThanh, { passive: true });
  document.addEventListener('click', moKhoaAmThanh);
  function bip(loai) {
    var ds = { ok: [[1760, 0, 0.12]], canh: [[880, 0, 0.12], [880, 0.18, 0.12]], loi: [[330, 0, 0.25], [262, 0.32, 0.3]] }[loai] || [];
    try {
      if (am) {
        var t = am.currentTime + 0.02;
        ds.forEach(function (b) {
          var o = am.createOscillator(), g = am.createGain(); o.type = 'square'; o.frequency.value = b[0];
          g.gain.setValueAtTime(0.0001, t + b[1]); g.gain.exponentialRampToValueAtTime(0.25, t + b[1] + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + b[1] + b[2]);
          o.connect(g); g.connect(am.destination); o.start(t + b[1]); o.stop(t + b[1] + b[2] + 0.02);
        });
      }
    } catch (e) { /* bỏ qua */ }
    try { if (navigator.vibrate) navigator.vibrate(loai === 'ok' ? 80 : loai === 'canh' ? [60, 80, 60] : [200, 100, 200]); } catch (e) { /* bỏ qua */ }
  }

  // ------------------------------------------------------------------ gọi web app
  function laLoiMang(err) { return !err || !err.ma && /Failed to fetch|NetworkError|Load failed|network|aborted|abort|Hết thời gian|HTTP 5/i.test(String(err.name + ' ' + err.message)); }
  function goi(duLieu) {
    duLieu.k = K;
    var ctl = window.AbortController ? new AbortController() : null;
    var hen = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    return fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(duLieu), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (kq) {
        clearTimeout(hen); datMang(true);
        if (!kq.ok) { var e = new Error(kq.loi || 'Web app báo lỗi'); e.ma = kq.ma || 'LOI'; if (e.ma === 'LINK_THU_HOI' || e.ma === 'LINK_SAI') manKhoa(e.message); throw e; }
        return kq;
      }, function (err) { clearTimeout(hen); if (laLoiMang(err)) datMang(false); throw err; });
  }
  var coMang = navigator.onLine !== false;
  function datMang(co) {
    coMang = co;
    var m = $('mang'); m.textContent = co ? '● Có mạng' : '● Mất mạng'; m.classList.toggle('mat', !co);
    if (co) guiHangCho();
  }
  window.addEventListener('online', function () { datMang(true); if (S.man === 'phong') taiPhong(); });
  window.addEventListener('offline', function () { datMang(false); });

  // ------------------------------------------------------------------ dữ liệu tải trước (dùng khi mất mạng)
  function docTaiTruoc(maDot) { try { var x = JSON.parse(doc(TIEN_TO + 'tt_' + maDot) || 'null'); return x && Date.now() - new Date(x.luuLuc).getTime() < 3 * 86400000 ? x : null; } catch (e) { return null; } }
  function donDuLieuCu(dsDotCon) {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf(TIEN_TO + 'tt_') === 0 && dsDotCon.indexOf(k.slice((TIEN_TO + 'tt_').length)) === -1) localStorage.removeItem(k);
      }
    } catch (e) { /* bỏ qua */ }
  }
  function bam(maTem) {
    if (!window.crypto || !crypto.subtle || !window.TextEncoder) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(maTem)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('').slice(0, 16);
    });
  }
  function maTemTu(chuoi) { var m = String(chuoi || '').match(/[?&]t=([^&#]+)/); return m ? decodeURIComponent(m[1]) : (/^https?:/i.test(chuoi) ? '' : String(chuoi || '').trim()); }

  // ------------------------------------------------------------------ hàng chờ khi mất mạng
  function luuHangCho() { luu(TIEN_TO + 'hangCho', JSON.stringify(S.hangCho)); }
  function themHangCho(l) { S.hangCho.push(l); luuHangCho(); }
  function guiHangCho() {
    if (S.dangGui || !S.hangCho.length || !coMang) return Promise.resolve();
    S.dangGui = true;
    var lo = S.hangCho.slice(0, 150);
    return goi({ viec: 'ghi', luot: lo }).then(function (r) {
      var daGui = {}; lo.forEach(function (l) { daGui[l.id] = true; });
      S.hangCho = S.hangCho.filter(function (l) { return !daGui[l.id]; }); luuHangCho();
      var kq = r.kq || [];
      var ghi = kq.filter(function (x) { return x.ok && (x.ket === 'daGhi'); }).length;
      S.ketQuaGui = { luc: new Date().toISOString(), ghi: ghi, khac: kq.filter(function (x) { return !(x.ok && x.ket === 'daGhi'); }) };
      bip(S.ketQuaGui.khac.length ? 'canh' : 'ok');
      S.dangGui = false;
      if (S.man === 'phong') { veDs(); taiPhong(); } else veLai();
      if (S.hangCho.length) return guiHangCho();
    }, function () { S.dangGui = false; });
  }
  function veHangCho() {
    var h = '';
    if (S.hangCho.length) h += '<div class="hang-cho"><span>⏳ ' + S.hangCho.length + ' lượt chờ gửi — có mạng sẽ tự gửi</span>' + (coMang ? '<button type="button" data-viec="guiNgay">Gửi ngay</button>' : '') + '</div>';
    var g = S.ketQuaGui;
    if (g && Date.now() - new Date(g.luc).getTime() < 120000) {
      h += '<div class="bao ' + (g.khac.length ? 'canh' : 'ok') + '">Đã gửi lượt chờ — ✓ ' + g.ghi + ' đã ghi' + (g.khac.length ? ' · ' + g.khac.length + ' không ghi' : '') +
        g.khac.slice(0, 6).map(function (x) { return '<small>• ' + thoat(moTaKetQua(x).chu) + '</small>'; }).join('') + '</div>';
    }
    return h;
  }
  function moTaKetQua(x) {
    if (!x.ok) return { loai: 'loi', chu: '✗ ' + (x.loi || 'Lỗi') };
    switch (x.ket) {
      case 'daGhi': return { loai: 'ok', chu: x.HoTen ? '✓ ' + x.HoTen + ' — Có mặt ' + gio(x.luc) : ('✓ Đã ghi' + (x.soGhi !== undefined ? ' ' + x.soGhi + ' người' : '') + (x.boQua && x.boQua.length ? ' (' + x.boQua.length + ' người đã có kết quả)' : '')) };
      case 'daCo': return { loai: 'canh', chu: '⚠ ' + (x.HoTen || '') + ' — đã có ' + (TEN_TT[x.tt] || x.tt || 'kết quả') + (x.luc ? ' ' + gio(x.luc) : '') + (x.boiTen ? ' (' + x.boiTen + ')' : '') };
      case 'saiPhong': return { loai: 'canh', chu: '⚠ Tem của phòng ' + (x.TenPhong || '?') + ' — ' + (x.HoTen || '') + ' (không tính cho phòng này)' };
      case 'temHet': return { loai: 'loi', chu: '✗ Tem đã thu hồi' + (x.HoTen ? ' — ' + x.HoTen : '') + (x.cau ? ': ' + x.cau : '') + '. Gỡ tem này khỏi giường.' };
      case 'saiTem': return { loai: 'loi', chu: '✗ Không phải tem KTX' };
      case 'xungDot': return { loai: 'canh', chu: '⚠ Người này vừa được ghi ' + (TEN_TT[x.tt] || 'chưa có') + (x.boiTen ? ' (' + x.boiTen + ')' : '') + ' — xem lại rồi sửa nếu cần' };
      case 'chuaMoDot': case 'ngoaiHan': return { loai: 'loi', chu: '✗ ' + (x.cau || 'Không ghi được') };
      default: return { loai: 'loi', chu: '✗ ' + (x.cau || x.loi || 'Không ghi được') };
    }
  }

  // ------------------------------------------------------------------ điều hướng (nút ‹ + nút Back của điện thoại)
  function diToi(man, them) { if (them !== false) try { history.pushState({ man: man, maDot: S.maDot, maPhong: S.maPhong }, ''); } catch (e) { /* bỏ qua */ } hienMan(man); }
  window.addEventListener('popstate', function (ev) {
    var st = ev.state || { man: 'ds' };
    if ($('lop').innerHTML) { dongLop(); try { history.pushState({ man: S.man, maDot: S.maDot, maPhong: S.maPhong }, ''); } catch (e) { /* bỏ qua */ } return; }
    S.maDot = st.maDot || ''; S.maPhong = st.maPhong || ''; hienMan(st.man || 'ds');
  });
  $('nutLui').addEventListener('click', function () { history.back(); });
  function hienMan(man) {
    if (S.man === 'phong' && man !== 'phong') tatCamera();
    S.man = man; dongLop();
    $('nutLui').hidden = man === 'ds' || man === 'khoa';
    $('dayDuoi').hidden = man !== 'phong';
    if (man === 'ds') taiDs(); else if (man === 'dot') taiDot(); else if (man === 'phong') vaoPhong();
  }
  function veLai() { if (S.man === 'ds') veDsDot(); else if (S.man === 'dot') veDot(); else if (S.man === 'phong') veDs(); }
  function manKhoa(chu) {
    tatCamera();
    try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf(TIEN_TO) === 0) localStorage.removeItem(k); } } catch (e) { /* bỏ qua */ }
    S.man = 'khoa'; S.hangCho = []; $('dayDuoi').hidden = true; $('nutLui').hidden = true; $('tieuDe').textContent = 'Quét tem KTX';
    $('than').innerHTML = '<div class="khoa"><div class="icon">🔒</div><h2>' + thoat(chu || 'Link quét này đã bị thu hồi') + '</h2><p class="phu">Liên hệ Ban Quản Lý để được cấp link mới (app → Quản lý tài khoản → Link quét tem). Các lượt chờ gửi trên máy này không được ghi.</p></div>';
  }

  // ------------------------------------------------------------------ màn 1: danh sách đợt
  function taiDs() {

    document.querySelectorAll('[data-viec="ghiTay"]').forEach(function (b) { b.disabled = !n; });
  }

  // ------------------------------------------------------------------ sự kiện
  document.addEventListener('change', function (ev) {
    if (ev.target.classList.contains('ttCa')) { document.querySelectorAll('.ttCb').forEach(function (x) { x.checked = ev.target.checked; }); demTay(); }
    else if (ev.target.classList.contains('ttCb')) demTay();
  });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-viec]'); if (!b) return;
    var viec = b.getAttribute('data-viec');
    if (viec === 'dongLop') { if (ev.target === b || b.tagName === 'BUTTON') dongLop(); return; }
    if (b.disabled) return;
    if (viec === 'vaoDot') { S.maDot = b.getAttribute('data-dot'); S.dot = null; S.dsPhong = []; diToi('dot'); }
    else if (viec === 'taiTruoc') taiTruoc(b.getAttribute('data-dot'), b);
    else if (viec === 'chonDay') { S.dayChon = b.getAttribute('data-day'); veDot(); }
    else if (viec === 'vaoPhong') { S.maPhong = b.getAttribute('data-phong'); diToi('phong'); }
    else if (viec === 'batCam') batCamera();
    else if (viec === 'guiNgay') guiHangCho();
    else if (viec === 'sua') moSua(b.getAttribute('data-ma'));
    else if (viec === 'tichTay') moTichTay();
    else if (viec === 'xongPhong') moXong();
    else if (viec === 'chonTT') { b.parentNode.querySelectorAll('.chon').forEach(function (x) { x.classList.toggle('on', x === b); }); }
    else if (viec === 'xongTT') { b.parentNode.querySelectorAll('.xongTT').forEach(function (x) { x.classList.toggle('on', x === b); }); }
    else if (viec === 'luuSua') {
      var on = document.querySelector('.tam .chon.on'); if (!on) { toast('Chọn kết quả'); return; }
      var t = on.getAttribute('data-tt'), ly = (document.querySelector('.suaLyDo') || {}).value || '';
      if (t === 'VangPhep' && !ly) { toast('Chọn lý do vắng'); return; }
      var maS = b.getAttribute('data-ma');
      dongLop();
      ghiLuot({ loai: 'sua', ma: maS, tt: t, truoc: b.getAttribute('data-truoc'), maLyDo: ly, ghiChu: (document.querySelector('.suaGhiChu') || {}).value || '' }, function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm — gửi khi có mạng'); return; }
        if (x.ok && x.ket === 'daGhi') capNhatCucBo(maS, t, 'tay', new Date().toISOString());
        baoKq(x.ok && x.ket === 'daGhi' ? { ok: true, ket: 'daGhi', soGhi: 1 } : x); veDs();
      });
    } else if (viec === 'hoanTac') {
      var maH = b.getAttribute('data-ma');
      dongLop();
      ghiLuot({ loai: 'sua', ma: maH, tt: '', truoc: 'CoMat' }, function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm — gửi khi có mạng'); return; }
        if (x.ok) { capNhatCucBo(maH, '', '', ''); $('vungKq').innerHTML = '<div class="bao canh">↶ Đã hoàn tác</div>'; } else baoKq(x);
        veDs();
      });
    } else if (viec === 'ghiTay') {
      var tt = b.getAttribute('data-tt'), ds = [].map.call(document.querySelectorAll('.ttCb:checked'), function (x) { return x.value; });
      var lyT = (document.querySelector('.ttLyDo') || {}).value || '';
      if (tt === 'VangPhep' && !lyT) { toast('Chọn lý do vắng'); return; }
      dongLop();
      ghiLuot({ loai: 'tay', dsMa: ds, tt: tt, maLyDo: lyT }, function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm ' + ds.length + ' người — gửi khi có mạng'); return; }
        if (x.ok) ds.forEach(function (m) { if (!(x.boQua || []).some(function (q) { return q === m; })) capNhatCucBo(m, tt, 'tay', new Date().toISOString()); });
        baoKq(x); veDs();
      });
    } else if (viec === 'xacNhanXong') {
      var dsX = {};
      document.querySelectorAll('.tam .cb[data-ma]').forEach(function (r) { var c = r.querySelector('.xongTT.on'); dsX[r.getAttribute('data-ma')] = { tt: c ? c.getAttribute('data-tt') : 'KhongThay' }; });
      dongLop();
      ghiLuot({ loai: 'xong', ds: dsX }, function (x) {
        if (x.ket === 'cho') { toast('⏳ Đã lưu tạm "Xong phòng" — gửi khi có mạng'); history.back(); return; }
        if (x.ok) { bip('ok'); toast('✓ Xong phòng'); history.back(); } else baoKq(x);
      });
    }
  });

  // tự làm mới phòng đang mở (BQL khác cùng đi / sửa trong app) — 10 giây / lần khi có mạng, không mở tấm trượt
  setInterval(function () { if (S.man === 'phong' && coMang && !document.hidden && !$('lop').innerHTML) taiPhong(); else if (coMang && S.hangCho.length) guiHangCho(); }, 10000);

  // ------------------------------------------------------------------ khởi động
  if (/Zalo|FBAN|FBAV|Instagram/i.test(navigator.userAgent || '')) toast('Đang mở trong Zalo / Facebook — nếu camera không chạy, mở bằng Safari / Chrome.');
  if (!K || !API) {
    $('than').innerHTML = '<div class="khoa"><div class="icon">🔗</div><h2>Thiếu link quét</h2><p class="phu">Mở trang này bằng link riêng được cấp trong app (Quản lý tài khoản → Link quét tem → Mở trang quét / quét mã QR).</p></div>';
    return;
  }
  try { history.replaceState({ man: 'ds' }, ''); } catch (e) { /* bỏ qua */ }
  if (thamSo.dot) { S.maDot = thamSo.dot; hienMan('ds'); diToi('dot'); } else hienMan('ds');
  if (coMang) guiHangCho();
})();
</script>
</body>
</html>
